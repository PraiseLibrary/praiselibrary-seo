name: Build and publish songs.praiselibrary.com

on:
  schedule:
    - cron: "41 19 * * *"   # daily, about 6:11 am Adelaide time
  workflow_dispatch:         # "Run workflow" button for an immediate rebuild
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Generate pages from Supabase
        run: node build.mjs
        env:
          SUPABASE_URL: https://ibzmbmaqdpexgcsplesk.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
